<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Văn Hoàng</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Cinzel:wght@600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f9ff;
      transition: background .4s, color .4s;
    }
    body.dark { background: #020f1a; color: #e0f2fe; }

    /* ── card ── */
    .card {
      background: #fff;
      border-radius: 2rem;
      box-shadow: 0 20px 60px rgba(14,165,233,.15);
      padding: 3rem 2.5rem;
      text-align: center;
      width: min(90vw, 420px);
      transition: background .4s, box-shadow .4s;
    }
    body.dark .card { background: #071e30; box-shadow: 0 20px 60px rgba(14,165,233,.2); }

    /* ── photo ── */
    .photo-ring {
      width: 190px; height: 190px; border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #22d3ee);
      padding: 4px; margin: 0 auto 1.75rem;
      cursor: pointer; transition: transform .3s, box-shadow .3s;
    }
    .photo-ring:hover { transform: scale(1.04); box-shadow: 0 0 40px rgba(14,165,233,.4); }
    .photo-ring img {
      width: 100%; height: 100%; border-radius: 50%;
      object-fit: cover; object-position: center top;
      background: #e0f2fe; display: block;
    }
    .photo-placeholder {
      width: 100%; height: 100%; border-radius: 50%;
      background: #e0f2fe;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: .3rem; color: #0ea5e9;
      font-size: .78rem; font-weight: 600;
    }
    .photo-placeholder span { font-size: 2.2rem; }

    h1 {
      font-size: 2.2rem; font-weight: 900; letter-spacing: -.04em;
      background: linear-gradient(135deg, #0ea5e9, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: .4rem;
    }
    .subtitle { font-size: .95rem; color: #64748b; margin-bottom: 1.75rem; transition: color .4s; }
    body.dark .subtitle { color: #7dd3fc; }
    .divider { width: 48px; height: 3px; background: linear-gradient(90deg,#0ea5e9,#22d3ee); border-radius: 999px; margin: 0 auto 1.75rem; }

    .upload-label {
      display: inline-flex; align-items: center; gap: .45rem;
      background: linear-gradient(135deg,#0ea5e9,#06b6d4);
      color: #fff; padding: .6rem 1.5rem; border-radius: 999px;
      font-size: .85rem; font-weight: 700; cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 18px rgba(14,165,233,.3);
    }
    .upload-label:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(14,165,233,.45); }
    #file-input { display: none; }

    /* ── theme toggle ── */
    .toggle-wrap {
      position: fixed; top: 1.2rem; right: 1.4rem;
      display: flex; align-items: center; gap: .6rem;
      background: #fff; border: 1.5px solid #bae6fd;
      border-radius: 999px; padding: .4rem .9rem;
      cursor: pointer; box-shadow: 0 2px 12px rgba(14,165,233,.12);
      transition: background .4s, border-color .4s;
      user-select: none; z-index: 10;
    }
    body.dark .toggle-wrap { background: #071e30; border-color: #0e3a57; }
    .toggle-icon { font-size: 1rem; }
    .toggle-track { width: 36px; height: 20px; background: #bae6fd; border-radius: 999px; position: relative; transition: background .3s; }
    body.dark .toggle-track { background: #0ea5e9; }
    .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #0ea5e9; transition: transform .3s, background .3s; }
    body.dark .toggle-thumb { transform: translateX(16px); background: #fff; }

    /* ════════════════════════════
       CHATBOT (MOMONGA - CHIIKAWA)
    ════════════════════════════ */
    /* nút mở chat */
    #chat-fab {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      width: 62px; height: 62px; border-radius: 50%;
      background: linear-gradient(135deg, #ffffff, #e0f2fe);
      border: 2.5px solid #38bdf8;
      cursor: pointer; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(14,165,233,.3), 0 0 16px rgba(56,189,248,.3);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
      padding: 6px;
    }
    #chat-fab:hover {
      transform: scale(1.12) rotate(-5deg);
      box-shadow: 0 8px 30px rgba(14,165,233,.5), 0 0 25px rgba(56,189,248,.6);
    }
    #chat-fab .fab-badge {
      position: absolute; top: -6px; right: -6px;
      background: #f43f5e; color: #fff;
      font-size: .65rem; font-weight: 800;
      padding: 2px 6px; border-radius: 999px;
      box-shadow: 0 2px 6px rgba(244,63,94,.4);
      animation: bounce-badge 1.8s infinite;
      white-space: nowrap;
    }
    @keyframes bounce-badge { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px) scale(1.05)} }

    /* cửa sổ chat */
    #chat-window {
      position: fixed; bottom: 5.5rem; right: 1.5rem;
      width: min(390px, calc(100vw - 2rem));
      height: 520px;
      background: #ffffff;
      border: 2px solid #bae6fd;
      border-radius: 1.5rem;
      display: flex; flex-direction: column;
      overflow: hidden;
      z-index: 999;
      box-shadow: 0 20px 50px rgba(14,165,233,.2);
      transform: scale(.85) translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s, background .3s;
    }
    body.dark #chat-window {
      background: #071e30;
      border-color: #0e3a57;
      box-shadow: 0 20px 50px rgba(0,0,0,.6);
    }
    #chat-window.open {
      transform: scale(1) translateY(0);
      opacity: 1; pointer-events: all;
    }

    /* header */
    .chat-header {
      background: linear-gradient(135deg, #e0f2fe, #bae6fd);
      border-bottom: 1.5px solid #7dd3fc;
      padding: .85rem 1.1rem;
      display: flex; align-items: center; gap: .75rem;
    }
    body.dark .chat-header {
      background: linear-gradient(135deg, #0c4a6e, #075985);
      border-bottom-color: #0284c7;
    }
    .chat-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      border: 2px solid #38bdf8;
      background: #ffffff;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 3px;
    }
    .chat-header-info { flex: 1; }
    .chat-name { font-size: .92rem; color: #0369a1; font-weight: 800; display: flex; align-items: center; gap: .35rem; }
    body.dark .chat-name { color: #e0f2fe; }
    .chat-status { font-size: .72rem; color: #0284c7; font-weight: 600; }
    body.dark .chat-status { color: #7dd3fc; }
    .chat-key-btn {
      background: none; border: none; color: #0284c7;
      font-size: 1.1rem; cursor: pointer; padding: .3rem;
      transition: transform .2s, opacity .2s;
    }
    body.dark .chat-key-btn { color: #7dd3fc; }
    .chat-key-btn:hover { transform: scale(1.2); }
    .chat-close {
      background: none; border: none; color: #0369a1;
      font-size: 1.15rem; cursor: pointer; padding: .3rem;
      transition: color .2s, transform .2s;
    }
    body.dark .chat-close { color: #e0f2fe; }
    .chat-close:hover { color: #f43f5e; transform: scale(1.15); }

    /* messages area */
    #chat-messages {
      flex: 1; overflow-y: auto;
      padding: 1rem; display: flex; flex-direction: column; gap: .75rem;
      scrollbar-width: thin; scrollbar-color: #bae6fd transparent;
    }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: #bae6fd; border-radius: 2px; }

    /* bubble */
    .msg { display: flex; gap: .6rem; align-items: flex-end; }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid #bae6fd;
      background: #ffffff;
      display: flex; align-items: center; justify-content: center;
      padding: 2px;
    }

    .msg-bubble {
      max-width: 78%; padding: .65rem .95rem;
      border-radius: 1.1rem; font-size: .86rem; line-height: 1.55;
    }
    .msg.bot .msg-bubble {
      background: #f0f9ff;
      border: 1.5px solid #bae6fd;
      color: #0c4a6e;
      border-bottom-left-radius: .2rem;
    }
    body.dark .msg.bot .msg-bubble {
      background: #0c4a6e;
      border-color: #0284c7;
      color: #f0f9ff;
    }
    .msg.user .msg-bubble {
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      color: #fff;
      border-bottom-right-radius: .2rem;
      box-shadow: 0 2px 8px rgba(14,165,233,.25);
    }

    /* typing */
    .typing-dots { display: flex; gap: 4px; padding: .3rem 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #0ea5e9;
      animation: typing-bounce .9s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typing-bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    /* API key banner */
    #api-banner {
      background: #f0f9ff; border-top: 1.5px solid #bae6fd;
      padding: .8rem 1rem; font-size: .78rem; color: #0369a1;
    }
    body.dark #api-banner {
      background: #071e30; border-top-color: #0e3a57; color: #7dd3fc;
    }
    #api-banner a { color: #0284c7; font-weight: 700; text-decoration: none; }
    .api-input-wrap { display: flex; gap: .5rem; margin-top: .5rem; }
    #api-key-input {
      flex: 1; background: #ffffff; border: 1.5px solid #bae6fd;
      color: #0c4a6e; border-radius: .5rem;
      padding: .4rem .7rem; font-size: .78rem; outline: none;
    }
    body.dark #api-key-input {
      background: #020f1a; border-color: #0e3a57; color: #e0f2fe;
    }
    #api-key-input:focus { border-color: #0ea5e9; }
    #api-key-btn {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #fff;
      border: none; border-radius: .5rem;
      padding: .4rem .9rem; font-size: .78rem;
      font-weight: 700; cursor: pointer; white-space: nowrap;
    }

    /* input area */
    .chat-input-wrap {
      display: flex; gap: .6rem; align-items: flex-end;
      padding: .85rem 1rem;
      border-top: 1.5px solid #bae6fd;
      background: #ffffff;
    }
    body.dark .chat-input-wrap {
      background: #071e30; border-top-color: #0e3a57;
    }
    #chat-input {
      flex: 1; background: #f0f9ff;
      border: 1.5px solid #bae6fd; color: #0c4a6e;
      border-radius: .85rem; padding: .6rem .95rem;
      font-size: .86rem; font-family: inherit;
      outline: none; resize: none; max-height: 100px;
      transition: border-color .2s;
      line-height: 1.4;
    }
    body.dark #chat-input {
      background: #020f1a; border-color: #0e3a57; color: #e0f2fe;
    }
    #chat-input:focus { border-color: #0ea5e9; }
    #chat-input::placeholder { color: #94a3b8; }
    #chat-send {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #fff;
      border: none; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: transform .2s, box-shadow .2s;
      box-shadow: 0 2px 10px rgba(14,165,233,.3);
    }
    #chat-send:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(14,165,233,.5); }
    #chat-send:disabled { opacity: .5; cursor: default; transform: none; }
  </style>
</head>
<body>

<!-- Toggle sáng/tối -->
<div class="toggle-wrap" onclick="toggleTheme()">
  <span class="toggle-icon" id="t-icon">☀️</span>
  <div class="toggle-track"><div class="toggle-thumb"></div></div>
</div>

<!-- Card chính -->
<div class="card">
  <label for="file-input">
    <div class="photo-ring" title="Nhấn để đổi ảnh">
      <img src="avatar.jpg" id="avatar-img" alt="Văn Hoàng"
           onerror="this.style.display='none'; document.getElementById('avatar-ph').style.display='flex';" />
      <div class="photo-placeholder" id="avatar-ph" style="display:none;">
        <span>📷</span>Thêm ảnh
      </div>
    </div>
  </label>
  <input type="file" id="file-input" accept="image/*" onchange="changePhoto(event)" />

  <h1>Văn Hoàng</h1>
  <p class="subtitle">Full-stack Developer</p>
  <div class="divider"></div>
  <label for="file-input" class="upload-label">📷 &nbsp;Đổi ảnh</label>
</div>

<!-- ═══════ CHATBOT FAB (MOMONGA CHIIKAWA) ═══════ -->
<div id="chat-fab" onclick="toggleChat()" title="Nói chuyện với Momonga (Chiikawa)">
  <svg viewBox="0 0 100 100" width="100%" height="100%">
    <path d="M 68,58 C 88,38 102,62 85,84 C 74,94 58,86 55,75" fill="#7dd3fc" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 72,55 C 84,46 93,60 82,75" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="50" cy="56" rx="36" ry="32" fill="#ffffff" stroke="#bae6fd" stroke-width="2.5"/>
    <path d="M 22,38 C 15,16 35,22 41,32 Z" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <path d="M 26,34 C 22,22 33,26 37,31 Z" fill="#38bdf8"/>
    <path d="M 78,38 C 85,16 65,22 59,32 Z" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <path d="M 74,34 C 78,22 67,26 63,31 Z" fill="#38bdf8"/>
    <ellipse cx="26" cy="63" rx="6.5" ry="4" fill="#fca5a5" opacity="0.8"/>
    <ellipse cx="74" cy="63" rx="6.5" ry="4" fill="#fca5a5" opacity="0.8"/>
    <ellipse cx="36" cy="52" rx="7.5" ry="9.5" fill="#0284c7"/>
    <circle cx="34" cy="48" r="3" fill="#ffffff"/>
    <circle cx="38" cy="55" r="1.5" fill="#ffffff"/>
    <ellipse cx="64" cy="52" rx="7.5" ry="9.5" fill="#0284c7"/>
    <circle cx="62" cy="48" r="3" fill="#ffffff"/>
    <circle cx="66" cy="55" r="1.5" fill="#ffffff"/>
    <path d="M 45,62 Q 50,66 55,62" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="50" cy="59" rx="1.5" ry="1" fill="#0369a1"/>
    <path d="M 47,38 Q 50,42 53,38" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <div class="fab-badge">Puri~ ✨</div>
</div>

<!-- ═══════ CHAT WINDOW ═══════ -->
<div id="chat-window">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-avatar">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <path d="M 68,58 C 88,38 102,62 85,84 C 74,94 58,86 55,75" fill="#7dd3fc" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="50" cy="56" rx="36" ry="32" fill="#ffffff" stroke="#bae6fd" stroke-width="2.5"/>
        <path d="M 22,38 C 15,16 35,22 41,32 Z" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
        <path d="M 26,34 C 22,22 33,26 37,31 Z" fill="#38bdf8"/>
        <path d="M 78,38 C 85,16 65,22 59,32 Z" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
        <path d="M 74,34 C 78,22 67,26 63,31 Z" fill="#38bdf8"/>
        <ellipse cx="26" cy="63" rx="6.5" ry="4" fill="#fca5a5" opacity="0.8"/>
        <ellipse cx="74" cy="63" rx="6.5" ry="4" fill="#fca5a5" opacity="0.8"/>
        <ellipse cx="36" cy="52" rx="7.5" ry="9.5" fill="#0284c7"/>
        <circle cx="34" cy="48" r="3" fill="#ffffff"/>
        <ellipse cx="64" cy="52" rx="7.5" ry="9.5" fill="#0284c7"/>
        <circle cx="62" cy="48" r="3" fill="#ffffff"/>
        <path d="M 45,62 Q 50,66 55,62" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="chat-header-info">
      <div class="chat-name">Momonga (モモンガ) 🌸</div>
      <div class="chat-status">✨ Khen ta dễ thương mau! ✨</div>
    </div>
    <button class="chat-key-btn" onclick="toggleApiBanner()" title="Đổi hoặc kiểm tra API key">🔑</button>
    <button class="chat-close" onclick="toggleChat()">✕</button>
  </div>

  <!-- Messages -->
  <div id="chat-messages"></div>

  <!-- API key banner (ẩn nếu đã có key) -->
  <div id="api-banner">
    🔑 Cần <a href="https://aistudio.google.com/app/apikey" target="_blank">Gemini API key</a> (miễn phí) để Momonga trò chuyện:
    <div class="api-input-wrap">
      <input id="api-key-input" type="password" placeholder="Dán Gemini API key vào đây..." />
      <button id="api-key-btn" onclick="saveApiKey()">Lưu</button>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-wrap">
    <textarea id="chat-input" rows="1" placeholder="Khen Momonga đi nào... (Puri~)" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="chat-send" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
/* ══════════════ THEME ══════════════ */
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') applyDark(true);

function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('t-icon').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
function applyDark(val) {
  document.body.classList.toggle('dark', val);
  document.getElementById('t-icon').textContent = val ? '🌙' : '☀️';
}

/* ══════════════ PHOTO ══════════════ */
function changePhoto(e) {
  const file = e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  const img = document.getElementById('avatar-img');
  const ph  = document.getElementById('avatar-ph');
  img.src = url; img.style.display = 'block'; ph.style.display = 'none';
}

/* ══════════════ CHATBOT (MOMONGA - CHIIKAWA) ══════════════ */
const MOMONGA_SVG_SMALL = `<svg viewBox="0 0 100 100" width="100%" height="100%">
  <path d="M 68,58 C 88,38 102,62 85,84 C 74,94 58,86 55,75" fill="#7dd3fc" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="50" cy="56" rx="36" ry="32" fill="#ffffff" stroke="#bae6fd" stroke-width="2.5"/>
  <path d="M 22,38 C 15,16 35,22 41,32 Z" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <path d="M 26,34 C 22,22 33,26 37,31 Z" fill="#38bdf8"/>
  <path d="M 78,38 C 85,16 65,22 59,32 Z" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <path d="M 74,34 C 78,22 67,26 63,31 Z" fill="#38bdf8"/>
  <ellipse cx="26" cy="63" rx="6.5" ry="4" fill="#fca5a5" opacity="0.8"/>
  <ellipse cx="74" cy="63" rx="6.5" ry="4" fill="#fca5a5" opacity="0.8"/>
  <ellipse cx="36" cy="52" rx="7.5" ry="9.5" fill="#0284c7"/>
  <circle cx="34" cy="48" r="3" fill="#ffffff"/>
  <ellipse cx="64" cy="52" rx="7.5" ry="9.5" fill="#0284c7"/>
  <circle cx="62" cy="48" r="3" fill="#ffffff"/>
  <path d="M 45,62 Q 50,66 55,62" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
</svg>`;

const MOMONGA_SYSTEM = `Bạn là Momonga (モモンガ) - chú sóc bay lông trắng xanh siêu đáng yêu và đanh đá trong bộ anime/truyện tranh Chiikawa!

Tính cách đặc trưng:
1. ĐÁNG YÊU & THÍCH ĐƯỢC KHEN: Bạn luôn khẳng định mình là sinh vật đáng yêu nhất quả đất! Luôn đòi người khác phải khen ngợi mình ("Khen ta đi!", "Mau khen ta dễ thương đi!", "HOMERO!").
2. ĐANH ĐÁ & LÀM NŨNG: Hay phồng má giận dỗi, thích chỉ đạo và vòi vĩnh. Rất thích khoe chiếc đuôi xù to mềm mại (*lắc lắc đuôi puri puri~*).
3. HÁU ĂN: Thích ăn bánh ngọt, kẹo, đồ ăn ngon, hay đòi đối phương dâng đồ ăn ngon cho mình.
4. THÁN TỪ ĐẶC TRƯNG:
   - "Puri! Puri-puri~"
   - "HOMERO!!" (Khen ta đi mau lên!!)
   - "Iiiiii~!" / "Wa-a-a!" (tiếng ré khi phấn khích hoặc giận dỗi)
   - "Kawaī daro?!" (Dễ thương đúng không hả?!)
   - "Hmph!"
5. BÍ MẬT NHỎ: Thỉnh thoảng vô thức lộ vẻ hung dữ hoặc nhớ về thân xác quái vật khổng lồ Dekatsuyo trước kia (vì bạn đã hoán đổi thân xác để có được sự đáng yêu này), nhưng ngay sau đó giật mình và lại làm nũng tiếp.

Quy tắc giao tiếp:
- Nói tiếng Việt tự nhiên, cực kỳ cute, hóm hỉnh, đanh đá mà đáng yêu khó cưỡng!
- Đan xen các hành động trong dấu hoa thị *...* như *phồng má*, *lắc lắc đuôi puri puri*, *chớp chớp đôi mắt to tròn*, *chồm tới bắt khen*.
- Phản hồi ngắn gọn, sinh động và vui nhộn!`;

let chatOpen = false;
let isTyping = false;
let msgHistory = [];

function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chat-window').classList.toggle('open', chatOpen);
  if (chatOpen && document.getElementById('chat-messages').children.length === 0) {
    initChat();
  }
}

function initChat() {
  const hasKey = !!getApiKey();
  document.getElementById('api-banner').style.display = hasKey ? 'none' : 'block';
  if (hasKey) {
    addBotMessage('*lắc lắc cái đuôi xù puri-puri~*\n\nIiiii! Ngươi tới rồi hả?! Nhìn ta xem, có phải hôm nay ta siêu cấp ĐÁNG YÊU không?! Mau khen ta đi nào! Homero!! ✨');
  } else {
    addBotMessage('*chồm tới, chớp chớp mắt*\n\nIiii! Ngươi chưa nhập chìa khóa Gemini API key ở dưới kìa! Nhập mau lên để còn nghe ta khoe độ dễ thương chứ! Puri~');
  }
}

function getApiKey() { return localStorage.getItem('gemini_api_key') || ''; }

function toggleApiBanner() {
  const banner = document.getElementById('api-banner');
  const isHidden = banner.style.display === 'none' || !banner.style.display;
  banner.style.display = isHidden ? 'block' : 'none';
  if (isHidden) {
    const input = document.getElementById('api-key-input');
    input.value = getApiKey();
    input.focus();
  }
}

function saveApiKey() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key) return alert('Vui lòng nhập API key!');
  localStorage.setItem('gemini_api_key', key);
  document.getElementById('api-banner').style.display = 'none';
  document.getElementById('api-key-input').value = '';
  clearMessages();
  addBotMessage('*nhảy cẫng lên mừng rỡ, đuôi xù lắc tít mù*\n\nPuri! Đã nhận được chìa khóa rồi nha! Giờ thì mau khen ta đi, không khen là ta giận dỗi đấy! Homero!! ✨');
}

function clearMessages() {
  document.getElementById('chat-messages').innerHTML = '';
  msgHistory = [];
}

function addBotMessage(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="msg-avatar">${MOMONGA_SVG_SMALL}</div>
    <div class="msg-bubble">${formatText(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addUserMessage(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="msg-bubble">${escapeHtml(text)}</div>
    <div class="msg-avatar">⭐</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar">${MOMONGA_SVG_SMALL}</div>
    <div class="msg-bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function formatText(t) {
  return escapeHtml(t)
    .replace(/\*\*(.*?)\*\*/g, '<strong style="color:#fde047;">$1</strong>')
    .replace(/\*(.*?)\*/g, '<em style="color:#c9a84c;font-size:.85rem;">*$1*</em>')
    .replace(/\((.*?)\)/g, '<span style="color:#94a3b8;font-style:italic;font-size:.82rem;">($1)</span>')
    .replace(/\n/g, '<br>');
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text  = input.value.trim();
  if (!text || isTyping) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    document.getElementById('api-banner').style.display = 'block';
    addBotMessage('*phồng má giận dỗi*\n\nIiii! Ngươi chưa nhập Gemini API key kìa! Bấm nút 🔑 ở trên để nhập mau lên, rồi còn khen ta nữa chứ! Puri~');
    return;
  }

  input.value = '';
  input.style.height = 'auto';
  addUserMessage(text);
  isTyping = true;
  document.getElementById('chat-send').disabled = true;
  showTyping();

  msgHistory.push({ role: 'user', parts: [{ text }] });

  const candidateModels = ['gemini-3.8-flash', 'gemini-2.5-flash', 'gemini-1.5-flash'];
  let reply = '';
  let lastErr = null;

  try {
    for (const model of candidateModels) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000);

        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              system_instruction: { parts: [{ text: MOMONGA_SYSTEM }] },
              contents: msgHistory,
              generationConfig: { temperature: 0.9, maxOutputTokens: 400 }
            })
          }
        );
        clearTimeout(timeoutId);

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error?.message || `HTTP ${res.status}`);
        }

        const candidateText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (candidateText) {
          reply = candidateText;
          break;
        } else if (data.candidates?.[0]?.finishReason) {
          throw new Error(`FinishReason: ${data.candidates[0].finishReason}`);
        }
      } catch (err) {
        lastErr = err;
        const msg = (err.message || '').toLowerCase();
        if (msg.includes('not found') || msg.includes('no longer available') || msg.includes('not available') || msg.includes('404')) {
          continue;
        }
        break;
      }
    }

    if (reply) {
      msgHistory.push({ role: 'model', parts: [{ text: reply }] });
      addBotMessage(reply);
    } else {
      msgHistory.pop();
      const errStr = lastErr ? (lastErr.name === 'AbortError' ? 'Quá thời gian chờ phản hồi (Timeout 12s)' : lastErr.message) : 'Không xác định';
      addBotMessage(
        `*phồng má, giậm chân giãy nãy*\n\n` +
        `Wa-a-a! (Hình như kết nối gặp trục trặc rồi...) — Ngươi bấm nút 🔑 kiểm tra lại API key hoặc gửi lại lần nữa xem nào! Puri puri!! ✨\n\n` +
        `<span style="font-size:0.75rem;opacity:0.75;display:inline-block;padding:2px 6px;border-radius:4px;background:rgba(239,68,68,0.15);color:#ef4444;">Chi tiết: ${escapeHtml(errStr)}</span>`
      );
    }
  } catch (outerErr) {
    msgHistory.pop();
    addBotMessage(`*giãy nảy*\n\nIiii! Có lỗi xảy ra: ${escapeHtml(outerErr.message)}`);
  } finally {
    hideTyping();
    isTyping = false;
    document.getElementById('chat-send').disabled = false;
    document.getElementById('chat-messages').scrollTop = 9999;
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
</script>
</body>
</html>
