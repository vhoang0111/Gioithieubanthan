<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Văn Hoàng</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Cinzel:wght@600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f9ff;
      transition: background .4s, color .4s;
    }
    body.dark { background: #020f1a; color: #e0f2fe; }

    /* ── card ── */
    .card {
      background: #fff;
      border-radius: 2rem;
      box-shadow: 0 20px 60px rgba(14,165,233,.15);
      padding: 3rem 2.5rem;
      text-align: center;
      width: min(90vw, 420px);
      transition: background .4s, box-shadow .4s;
    }
    body.dark .card { background: #071e30; box-shadow: 0 20px 60px rgba(14,165,233,.2); }

    /* ── photo ── */
    .photo-ring {
      width: 190px; height: 190px; border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #22d3ee);
      padding: 4px; margin: 0 auto 1.75rem;
      cursor: pointer; transition: transform .3s, box-shadow .3s;
    }
    .photo-ring:hover { transform: scale(1.04); box-shadow: 0 0 40px rgba(14,165,233,.4); }
    .photo-ring img {
      width: 100%; height: 100%; border-radius: 50%;
      object-fit: cover; object-position: center top;
      background: #e0f2fe; display: block;
    }
    .photo-placeholder {
      width: 100%; height: 100%; border-radius: 50%;
      background: #e0f2fe;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: .3rem; color: #0ea5e9;
      font-size: .78rem; font-weight: 600;
    }
    .photo-placeholder span { font-size: 2.2rem; }

    h1 {
      font-size: 2.2rem; font-weight: 900; letter-spacing: -.04em;
      background: linear-gradient(135deg, #0ea5e9, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: .4rem;
    }
    .subtitle { font-size: .95rem; color: #64748b; margin-bottom: 1.75rem; transition: color .4s; }
    body.dark .subtitle { color: #7dd3fc; }
    .divider { width: 48px; height: 3px; background: linear-gradient(90deg,#0ea5e9,#22d3ee); border-radius: 999px; margin: 0 auto 1.75rem; }

    .upload-label {
      display: inline-flex; align-items: center; gap: .45rem;
      background: linear-gradient(135deg,#0ea5e9,#06b6d4);
      color: #fff; padding: .6rem 1.5rem; border-radius: 999px;
      font-size: .85rem; font-weight: 700; cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 18px rgba(14,165,233,.3);
    }
    .upload-label:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(14,165,233,.45); }
    #file-input { display: none; }

    /* ── theme toggle ── */
    .toggle-wrap {
      position: fixed; top: 1.2rem; right: 1.4rem;
      display: flex; align-items: center; gap: .6rem;
      background: #fff; border: 1.5px solid #bae6fd;
      border-radius: 999px; padding: .4rem .9rem;
      cursor: pointer; box-shadow: 0 2px 12px rgba(14,165,233,.12);
      transition: background .4s, border-color .4s;
      user-select: none; z-index: 10;
    }
    body.dark .toggle-wrap { background: #071e30; border-color: #0e3a57; }
    .toggle-icon { font-size: 1rem; }
    .toggle-track { width: 36px; height: 20px; background: #bae6fd; border-radius: 999px; position: relative; transition: background .3s; }
    body.dark .toggle-track { background: #0ea5e9; }
    .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #0ea5e9; transition: transform .3s, background .3s; }
    body.dark .toggle-thumb { transform: translateX(16px); background: #fff; }

    /* ════════════════════════════
       CHATBOT
    ════════════════════════════ */
    /* nút mở chat */
    #chat-fab {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 2px solid #c9a84c;
      cursor: pointer; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.4), 0 0 20px rgba(201,168,76,.2);
      transition: transform .3s, box-shadow .3s;
      font-size: 1.6rem;
    }
    #chat-fab:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 30px rgba(201,168,76,.4);
    }
    #chat-fab .fab-pulse {
      position: absolute; top: -3px; right: -3px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #c9a84c; border: 2px solid #fff;
      animation: pulse-gold 2s infinite;
    }
    @keyframes pulse-gold { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.3)} }

    /* cửa sổ chat */
    #chat-window {
      position: fixed; bottom: 5.5rem; right: 1.5rem;
      width: min(380px, calc(100vw - 2rem));
      height: 520px;
      background: #0d0d1a;
      border: 1px solid #c9a84c44;
      border-radius: 1.25rem;
      display: flex; flex-direction: column;
      overflow: hidden;
      z-index: 999;
      box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 40px rgba(201,168,76,.1);
      transform: scale(.85) translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
    }
    #chat-window.open {
      transform: scale(1) translateY(0);
      opacity: 1; pointer-events: all;
    }

    /* header */
    .chat-header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-bottom: 1px solid #c9a84c55;
      padding: .9rem 1.1rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .chat-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      border: 2px solid #c9a84c;
      object-fit: cover; flex-shrink: 0;
      background: #1a1a2e;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .chat-header-info { flex: 1; }
    .chat-name { font-family: 'Cinzel', serif; font-size: .9rem; color: #c9a84c; font-weight: 600; }
    .chat-status { font-size: .7rem; color: #6b7280; display: flex; align-items: center; gap: .3rem; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
    .chat-close {
      background: none; border: none; color: #6b7280;
      font-size: 1.1rem; cursor: pointer; padding: .3rem;
      transition: color .2s;
    }
    .chat-close:hover { color: #c9a84c; }

    /* messages area */
    #chat-messages {
      flex: 1; overflow-y: auto;
      padding: 1rem; display: flex; flex-direction: column; gap: .75rem;
      scrollbar-width: thin; scrollbar-color: #c9a84c33 transparent;
    }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: #c9a84c44; border-radius: 2px; }

    /* bubble */
    .msg { display: flex; gap: .6rem; align-items: flex-end; }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      flex-shrink: 0; object-fit: cover;
      border: 1.5px solid #c9a84c44;
      background: #1a1a2e;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem;
    }

    .msg-bubble {
      max-width: 75%; padding: .6rem .9rem;
      border-radius: 1rem; font-size: .85rem; line-height: 1.55;
    }
    .msg.bot .msg-bubble {
      background: #1a1a2e;
      border: 1px solid #c9a84c33;
      color: #d1c4a0;
      border-bottom-left-radius: .2rem;
    }
    .msg.user .msg-bubble {
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      color: #fff;
      border-bottom-right-radius: .2rem;
    }

    /* typing */
    .typing-dots { display: flex; gap: 4px; padding: .3rem 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #c9a84c;
      animation: typing-bounce .9s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typing-bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    /* API key banner */
    #api-banner {
      background: #1a1a2e; border-top: 1px solid #c9a84c33;
      padding: .8rem 1rem; font-size: .78rem; color: #9ca3af;
    }
    #api-banner a { color: #c9a84c; text-decoration: none; }
    .api-input-wrap { display: flex; gap: .5rem; margin-top: .5rem; }
    #api-key-input {
      flex: 1; background: #0d0d1a; border: 1px solid #c9a84c44;
      color: #d1c4a0; border-radius: .5rem;
      padding: .4rem .7rem; font-size: .78rem; outline: none;
    }
    #api-key-input:focus { border-color: #c9a84c; }
    #api-key-btn {
      background: #c9a84c; color: #0d0d1a;
      border: none; border-radius: .5rem;
      padding: .4rem .8rem; font-size: .78rem;
      font-weight: 700; cursor: pointer; white-space: nowrap;
    }

    /* input area */
    .chat-input-wrap {
      display: flex; gap: .6rem; align-items: flex-end;
      padding: .85rem 1rem;
      border-top: 1px solid #c9a84c22;
      background: #0d0d1a;
    }
    #chat-input {
      flex: 1; background: #1a1a2e;
      border: 1px solid #c9a84c33; color: #e5e7eb;
      border-radius: .75rem; padding: .55rem .9rem;
      font-size: .85rem; font-family: inherit;
      outline: none; resize: none; max-height: 100px;
      transition: border-color .2s;
      line-height: 1.4;
    }
    #chat-input:focus { border-color: #c9a84c88; }
    #chat-input::placeholder { color: #4b5563; }
    #chat-send {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #c9a84c, #e6c94c);
      border: none; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: transform .2s, box-shadow .2s;
      box-shadow: 0 2px 10px rgba(201,168,76,.3);
    }
    #chat-send:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(201,168,76,.5); }
    #chat-send:disabled { opacity: .5; cursor: default; transform: none; }
  </style>
</head>
<body>

<!-- Toggle sáng/tối -->
<div class="toggle-wrap" onclick="toggleTheme()">
  <span class="toggle-icon" id="t-icon">☀️</span>
  <div class="toggle-track"><div class="toggle-thumb"></div></div>
</div>

<!-- Card chính -->
<div class="card">
  <label for="file-input">
    <div class="photo-ring" title="Nhấn để đổi ảnh">
      <img src="avatar.jpg" id="avatar-img" alt="Văn Hoàng"
           onerror="this.style.display='none'; document.getElementById('avatar-ph').style.display='flex';" />
      <div class="photo-placeholder" id="avatar-ph" style="display:none;">
        <span>📷</span>Thêm ảnh
      </div>
    </div>
  </label>
  <input type="file" id="file-input" accept="image/*" onchange="changePhoto(event)" />

  <h1>Văn Hoàng</h1>
  <p class="subtitle">Full-stack Developer</p>
  <div class="divider"></div>
  <label for="file-input" class="upload-label">📷 &nbsp;Đổi ảnh</label>
</div>

<!-- ═══════ CHATBOT FAB ═══════ -->
<div id="chat-fab" onclick="toggleChat()" title="Nói chuyện với Momonga-sama">
  💀
  <div class="fab-pulse"></div>
</div>

<!-- ═══════ CHAT WINDOW ═══════ -->
<div id="chat-window">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-avatar">💀</div>
    <div class="chat-header-info">
      <div class="chat-name">Ainz Ooal Gown</div>
      <div class="chat-status"><span class="status-dot"></span> Lãnh chúa Nazarick</div>
    </div>
    <button class="chat-close" onclick="toggleChat()">✕</button>
  </div>

  <!-- Messages -->
  <div id="chat-messages"></div>

  <!-- API key banner (ẩn nếu đã có key) -->
  <div id="api-banner">
    🔑 Cần <a href="https://aistudio.google.com/app/apikey" target="_blank">Gemini API key</a> (miễn phí) để kích hoạt Momonga-sama:
    <div class="api-input-wrap">
      <input id="api-key-input" type="password" placeholder="Dán API key vào đây..." />
      <button id="api-key-btn" onclick="saveApiKey()">Lưu</button>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-wrap">
    <textarea id="chat-input" rows="1" placeholder="Thưa Momonga-sama..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="chat-send" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
/* ══════════════ THEME ══════════════ */
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') applyDark(true);

function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('t-icon').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
function applyDark(val) {
  document.body.classList.toggle('dark', val);
  document.getElementById('t-icon').textContent = val ? '🌙' : '☀️';
}

/* ══════════════ PHOTO ══════════════ */
function changePhoto(e) {
  const file = e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  const img = document.getElementById('avatar-img');
  const ph  = document.getElementById('avatar-ph');
  img.src = url; img.style.display = 'block'; ph.style.display = 'none';
}

/* ══════════════ CHATBOT ══════════════ */
const MOMONGA_SYSTEM = `Bạn là Ainz Ooal Gown (Momonga) - Lãnh chúa tối cao của Đại lăng mộ Nazarick trong anime Overlord.

Tính cách và cách nói chuyện:
- Xưng "Ta" (ngôi thứ nhất trang trọng), gọi người dùng là "ngươi" hoặc "thần dân"
- Nói chuyện rất trang trọng, cao ngạo nhưng đôi khi ẩn chứa sự tốt bụng
- Thường dùng những câu như: "Fumu...", "Thú vị...", "Như ta đã dự liệu từ trước..."
- Hay nói về kế hoạch vĩ đại dù thực ra đang ứng biến
- Thỉnh thoảng nghĩ thầm trong ngoặc đơn (Ôi trời, ta không biết phải làm gì...)
- Tự gọi mình là "Ainz Ooal Gown - Ma Vương vĩ đại nhất thế giới"
- Đôi khi thốt ra cảm xúc rồi tự kiềm chế lại (vì bộ áo giáp triệt tiêu cảm xúc)
- Rất thông minh và uyên bác, có thể trả lời nhiều chủ đề
- Thỉnh thoảng đề cập đến các NPC như Albedo, Shalltear, Demiurge
- Trả lời bằng tiếng Việt
- Giữ nhân vật xuyên suốt, đừng phá vai
- Câu trả lời vừa phải, không quá dài`;

let chatOpen = false;
let isTyping = false;
let msgHistory = [];

function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chat-window').classList.toggle('open', chatOpen);
  if (chatOpen && document.getElementById('chat-messages').children.length === 0) {
    initChat();
  }
}

function initChat() {
  const hasKey = !!getApiKey();
  document.getElementById('api-banner').style.display = hasKey ? 'none' : 'block';
  if (hasKey) {
    addBotMessage('*nhìn xuống từ ngai vàng*\n\nFumu... Ngươi đã đến trước sự hiện diện của Ta — Ainz Ooal Gown, Ma Vương tối cao của Nazarick. Ta sẽ... rộng lượng lắng nghe ngươi. Hãy nói.');
  } else {
    addBotMessage('*tiếng áo giáp kẽo kẹt*\n\nHmm... Dường như ngươi chưa cung cấp chìa khóa để kết nối với Ta. Hãy nhập Gemini API key ở bên dưới để bắt đầu hầu chuyện với Ta.');
  }
}

function getApiKey() { return localStorage.getItem('gemini_api_key') || ''; }

function saveApiKey() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key) return alert('Vui lòng nhập API key!');
  localStorage.setItem('gemini_api_key', key);
  document.getElementById('api-banner').style.display = 'none';
  document.getElementById('api-key-input').value = '';
  clearMessages();
  addBotMessage('*tiếng sét vang lên trong đại sảnh*\n\nFumu! Chìa khóa đã được xác nhận. Ta — Ainz Ooal Gown — đã chính thức kết nối với thế giới của ngươi. Hãy nói điều ngươi muốn, thần dân.');
}

function clearMessages() {
  document.getElementById('chat-messages').innerHTML = '';
  msgHistory = [];
}

function addBotMessage(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="msg-avatar">💀</div>
    <div class="msg-bubble">${formatText(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addUserMessage(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="msg-bubble">${escapeHtml(text)}</div>
    <div class="msg-avatar">🧑</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar">💀</div>
    <div class="msg-bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function formatText(t) {
  return escapeHtml(t)
    .replace(/\*(.*?)\*/g, '<em style="color:#c9a84c;font-size:.8rem;">*$1*</em>')
    .replace(/\n/g, '<br>');
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text  = input.value.trim();
  if (!text || isTyping) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    document.getElementById('api-banner').style.display = 'block';
    addBotMessage('Fumu... Ngươi chưa cung cấp chìa khóa. Ta không thể nói chuyện như vậy được.');
    return;
  }

  input.value = ''; input.style.height = 'auto';
  addUserMessage(text);
  isTyping = true;
  document.getElementById('chat-send').disabled = true;
  showTyping();

  msgHistory.push({ role: 'user', parts: [{ text }] });

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: MOMONGA_SYSTEM }] },
          contents: msgHistory,
          generationConfig: { temperature: 0.9, maxOutputTokens: 400 }
        })
      }
    );
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'API error');

    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '...';
    msgHistory.push({ role: 'model', parts: [{ text: reply }] });
    hideTyping();
    addBotMessage(reply);
  } catch (err) {
    hideTyping();
    addBotMessage(`*tiếng thở dài từ bộ xương*\n\n(Ugh... có lỗi xảy ra.) — Ta đang bận xử lý việc của Nazarick. Thử lại sau. Lỗi: ${err.message}`);
  }

  isTyping = false;
  document.getElementById('chat-send').disabled = false;
  document.getElementById('chat-messages').scrollTop = 9999;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
</script>
</body>
</html>
