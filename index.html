<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Văn Hoàng</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f9ff;
      transition: background .4s, color .4s;
    }

    body.dark {
      background: #020f1a;
      color: #e0f2fe;
    }

    /* ── card ── */
    .card {
      background: #fff;
      border-radius: 2rem;
      box-shadow: 0 20px 60px rgba(14,165,233,.15);
      padding: 3rem 2.5rem;
      text-align: center;
      width: min(90vw, 420px);
      transition: background .4s, box-shadow .4s;
    }

    body.dark .card {
      background: #071e30;
      box-shadow: 0 20px 60px rgba(14,165,233,.2);
    }

    /* ── photo ── */
    .photo-ring {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #22d3ee);
      padding: 4px;
      margin: 0 auto 1.75rem;
      cursor: pointer;
      transition: transform .3s, box-shadow .3s;
    }
    .photo-ring:hover {
      transform: scale(1.04);
      box-shadow: 0 0 40px rgba(14,165,233,.4);
    }

    .photo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      background: #e0f2fe;
      display: block;
    }

    /* upload placeholder khi chưa có ảnh */
    .photo-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .3rem;
      color: #0ea5e9;
      font-size: .78rem;
      font-weight: 600;
    }
    .photo-placeholder span { font-size: 2.2rem; }

    /* ── name ── */
    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -.04em;
      background: linear-gradient(135deg, #0ea5e9, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: .4rem;
    }

    .subtitle {
      font-size: .95rem;
      color: #64748b;
      margin-bottom: 1.75rem;
      transition: color .4s;
    }
    body.dark .subtitle { color: #7dd3fc; }

    /* ── divider ── */
    .divider {
      width: 48px; height: 3px;
      background: linear-gradient(90deg, #0ea5e9, #22d3ee);
      border-radius: 999px;
      margin: 0 auto 1.75rem;
    }

    /* ── upload btn ── */
    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      color: #fff;
      padding: .6rem 1.5rem;
      border-radius: 999px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 18px rgba(14,165,233,.3);
    }
    .upload-label:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(14,165,233,.45);
    }
    #file-input { display: none; }

    /* ── theme toggle ── */
    .toggle-wrap {
      position: fixed;
      top: 1.2rem; right: 1.4rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      background: #fff;
      border: 1.5px solid #bae6fd;
      border-radius: 999px;
      padding: .4rem .9rem;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(14,165,233,.12);
      transition: background .4s, border-color .4s;
      user-select: none;
      z-index: 10;
    }
    body.dark .toggle-wrap {
      background: #071e30;
      border-color: #0e3a57;
    }

    .toggle-icon { font-size: 1rem; }

    .toggle-track {
      width: 36px; height: 20px;
      background: #bae6fd;
      border-radius: 999px;
      position: relative;
      transition: background .3s;
    }
    body.dark .toggle-track { background: #0ea5e9; }

    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #0ea5e9;
      transition: transform .3s, background .3s;
    }
    body.dark .toggle-thumb {
      transform: translateX(16px);
      background: #fff;
    }
  </style>
</head>
<body>

<!-- Toggle sáng/tối -->
<div class="toggle-wrap" onclick="toggleTheme()">
  <span class="toggle-icon" id="t-icon">☀️</span>
  <div class="toggle-track">
    <div class="toggle-thumb"></div>
  </div>
</div>

<!-- Card chính -->
<div class="card">

  <!-- Ảnh -->
  <label for="file-input">
    <div class="photo-ring" title="Nhấn để đổi ảnh">
      <img src="avatar.jpg" id="avatar-img"
           alt="Văn Hoàng"
           onerror="this.style.display='none'; document.getElementById('avatar-ph').style.display='flex';"
      />
      <div class="photo-placeholder" id="avatar-ph" style="display:none;">
        <span>📷</span>Thêm ảnh
      </div>
    </div>
  </label>
  <input type="file" id="file-input" accept="image/*" onchange="changePhoto(event)" />

  <!-- Tên -->
  <h1>Văn Hoàng</h1>
  <p class="subtitle">Full-stack Developer</p>
  <div class="divider"></div>

  <!-- Nút đổi ảnh -->
  <label for="file-input" class="upload-label">
    📷 &nbsp;Đổi ảnh
  </label>

</div>

<script>
  /* ── Theme ── */
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') applyDark(true);

  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark');
    document.getElementById('t-icon').textContent = isDark ? '🌙' : '☀️';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }

  function applyDark(val) {
    document.body.classList.toggle('dark', val);
    document.getElementById('t-icon').textContent = val ? '🌙' : '☀️';
  }

  /* ── Đổi ảnh (chỉ local preview) ── */
  function changePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = document.getElementById('avatar-img');
    const ph  = document.getElementById('avatar-ph');
    img.src = url;
    img.style.display = 'block';
    ph.style.display  = 'none';
  }
</script>
</body>
</html>
